name: Deploy to Supabase

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    # These environment variables are available to all steps in the job
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Use the same version as your local dev environment to avoid warnings
          version: 1.226.4

      # The 'link' command is removed as it's problematic in CI.
      # We now pass the project-ref directly to the deploy command.
      - name: Deploy Supabase Edge Functions
        run: supabase functions deploy --project-ref $SUPABASE_PROJECT_REF --no-verify-jwt
